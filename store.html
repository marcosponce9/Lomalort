<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store | LomaLort Games</title><meta name="description" content="We are an indie game development studio; we also offer services to collaborate on other projects or create custom games."><meta property="og:title" content="Store | LomaLort Games"><meta property="og:image" content="img/marcux-portada.webp"><link rel="icon" href="img/logo.png"><link rel="stylesheet" href="style.css"></head><body><section><div class="w"><h1>Store</h1><p class="mute">Explore our official merch and support us as we continue creating games, stories, characters, and worlds.</p><div class="tabs" id="tb"></div><div class="grid" id="pd"></div></div></section><script>
const G=['Marcux','Spiriat','Don-Tuch'];
const C={'Adult Clothing':[['Unisex classic tee',23],['Unisex Hoodie',46.5],['Snapback Hat',26.5,['Marcux']],['5 panel cap',20,['Marcux']]],"Kids' Clothing":[['Youth Short Sleeve T-Shirt',28.5],['Toddler Short Sleeve Tee',26]],'Accessories':[['Black Glossy Mug',11.5],['Backpack',50],['Desk mat',13]]};
let cur='Adult Clothing';
function r(){tb.innerHTML=Object.keys(C).map(c=>`<button class="${c==cur?'on':''}" data-c="${c}">${c}</button>`).join('');
pd.innerHTML=C[cur].flatMap(([n,p,o])=>(o||G).map(g=>`<article class="card"><div class="ph">${g}<br>${n}</div><div class="b"><h4>${g} - ${n}</h4><span class="pr">£${p.toFixed(2)}</span><div class="lk"><a href="contact-us.html">Buy</a></div></div></article>`)).join('')}
tb.onclick=e=>{if(e.target.dataset.c){cur=e.target.dataset.c;r()}};r();</script><script src="layout.js"></script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store | LomaLort Games</title>
<meta name="description" content="We are an indie game development studio; we also offer services to collaborate on other projects or create custom games.">
<meta property="og:title" content="Store | LomaLort Games">
<meta property="og:image" content="img/marcux-portada.webp">
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="style.css">
<style>
  /* Estilos del carrusel y botones */
  .ph { 
    position: relative; 
    overflow: hidden; 
    padding: 10px; 
    background: #15162c; 
    height: 240px; 
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ph img { 
    max-width: 100%; 
    max-height: 100%; 
    object-fit: contain; 
    display: block; 
  }
  .sld-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(13, 14, 28, 0.85); color: #fff; border: 1px solid rgba(255,255,255,0.2);
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 16px; z-index: 2;
  }
  .sld-btn:hover { background: #6c63ff; }
  .sld-prev { left: 8px; }
  .sld-next { right: 8px; }
  .sld-dots {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; z-index: 2; background: rgba(13, 14, 28, 0.7);
    padding: 3px 6px; border-radius: 10px; max-width: 90%; overflow-x: auto;
  }
  .sld-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.4); flex-shrink: 0; }
  .sld-dot.active { background: #fff; }

  /* Botón flotante del carrito */
  .cart-float-btn {
    position: fixed; bottom: 20px; right: 20px; background: #6c63ff; color: #fff;
    border: none; padding: 12px 20px; border-radius: 30px; font-weight: bold;
    cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 999;
    display: flex; align-items: center; gap: 8px; font-size: 15px; transition: background 0.2s;
  }
  .cart-float-btn:hover { background: #574ede; }

  /* Panel lateral del carrito (Drawer) */
  .cart-drawer {
    position: fixed; top: 0; right: -400px; width: 380px; height: 100%;
    background: #121324; box-shadow: -5px 0 25px rgba(0,0,0,0.5); z-index: 1000;
    transition: right 0.3s ease; display: flex; flex-direction: column; color: #fff;
    border-left: 1px solid rgba(255,255,255,0.1);
  }
  .cart-drawer.open { right: 0; }
  .cart-header {
    padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; justify-content: space-between; align-items: center;
  }
  .cart-header h3 { margin: 0; font-size: 18px; }
  .close-cart { background: none; border: none; color: #aaa; font-size: 22px; cursor: pointer; }
  .close-cart:hover { color: #fff; }
  .cart-body { padding: 20px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  .cart-item {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.03); padding: 10px 15px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .cart-item-info h5 { margin: 0 0 4px 0; font-size: 14px; }
  .cart-item-info span { font-size: 13px; color: #a0a0c0; }
  .cart-item-remove { background: none; border: none; color: #ff5c5c; cursor: pointer; font-size: 16px; }
  .cart-footer {
    padding: 20px; border-top: 1px solid rgba(255,255,255,0.1);
    background: #0d0e1c; display: flex; flex-direction: column; gap: 12px;
  }
  .cart-total { display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; }
  .checkout-btn {
    background: #28a745; color: #fff; border: none; padding: 12px; border-radius: 6px;
    font-weight: bold; cursor: pointer; text-align: center; font-size: 15px; text-decoration: none;
  }
  .checkout-btn:hover { background: #218838; }
  .empty-cart { text-align: center; color: #888; margin-top: 40px; }
</style>
</head>
<body>

<section>
<div class="w">
<h1>Store</h1>
<p class="mute">Explore our official merch and support us as we continue creating games, stories, characters, and worlds.</p>
<div class="tabs" id="tb"></div>
<div class="grid" id="pd"></div>
</div>
</section>

<!-- Botón flotante para abrir el carrito -->
<button class="cart-float-btn" onclick="toggleCart()">
  🛒 Cart (<span id="cart-count">0</span>)
</button>

<!-- Panel lateral deslizante del carrito -->
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h3>Your Shopping Cart</h3>
    <button class="close-cart" onclick="toggleCart()">&times;</button>
  </div>
  <div class="cart-body" id="cart-items-container">
    <!-- Los productos se cargan aquí de forma dinámica -->
  </div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total:</span>
      <span id="cart-total-price">$0.00 USD</span>
    </div>
    <button class="checkout-btn" onclick="checkoutCart()">Proceed to Checkout</button>
  </div>
</div>

<script>
// Función para generar las rutas automáticas estándar
const itemImgs = (folder, fileBase, total) => 
  Array.from({ length: total }, (_, i) => `img/store/${folder}/${fileBase} (${i + 1}).png`);

// Lista específica para la gorra
const capImgs = [
  ...Array.from({ length: 6 }, (_, i) => `img/store/4. marcux cap/Marcux panel cap (${i + 1}).png`),
  ...Array.from({ length: 7 }, (_, i) => `img/store/4. marcux cap/Marcux people cap (${i + 1}).png`)
];

// Lista unificada para la mochila de Spiriat
const spiriatBackpackImgs = [
  ...itemImgs('5. spiriat backpack', 'spiriat backpack', 8),
  ...Array.from({ length: 3 }, (_, i) => `img/store/5. spiriat backpack/spiriat backpack kid (${i + 1}).png`)
];

// Catálogo completo con enlaces de Stripe
const C = {
  'Adult Clothing': [],
  "Kids' Clothing": [],
  'Accessories': [
    ['Marcux Desk mat', 13.00, itemImgs('1. desk-mat marcux', 'desk-mat marcux', 6), 'https://buy.stripe.com/3cI00l1Pa5tL2pnfY7aEE00'],
    ['Don-Tuch Backpack', 37.50, itemImgs('2. don-tuch backpack', 'don-tuch backpack', 18), 'https://buy.stripe.com/5kQcN73Xi8FXe85cLVaEE06'],
    ['Don-Tuch Black Glossy Mug', 11.50, itemImgs('3. don-tuch black glossy mug', 'don-tuch black glossy mug', 8), 'https://buy.stripe.com/dRmfZj9hCf4l8NL9zJaEE02'],
    ['Marcux Cap', 22.00, capImgs, 'https://buy.stripe.com/00wbJ30L6cWd3trfY7aEE03'],
    ['Spiriat Backpack', 37.50, spiriatBackpackImgs, 'https://buy.stripe.com/bJe4gB9hC9K13tr5jtaEE04']
  ]
};

let cur = 'Accessories';
let cart = JSON.parse(localStorage.getItem('lomalort_cart')) || [];

function moveSlide(btn, dir) {
  const box = btn.closest('.ph');
  const list = JSON.parse(box.dataset.imgs);
  let idx = (parseInt(box.dataset.idx) + dir + list.length) % list.length;
  box.dataset.idx = idx;
  box.querySelector('img').src = list[idx];
  box.querySelectorAll('.sld-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
}

function r() {
  tb.innerHTML = Object.keys(C).map(c => `<button class="${c === cur ? 'on' : ''}" data-c="${c}">${c}</button>`).join('');
  
  pd.innerHTML = C[cur].map(([name, price, list, link]) => {
    const multi = list.length > 1;
    return `
      <article class="card">
        <div class="ph" data-imgs='${JSON.stringify(list)}' data-idx="0">
          <img src="${list[0]}" alt="${name}" loading="lazy">
          ${multi ? `
            <button type="button" class="sld-btn sld-prev" onclick="moveSlide(this, -1)">‹</button>
            <button type="button" class="sld-btn sld-next" onclick="moveSlide(this, 1)">›</button>
            <div class="sld-dots">${list.map((_, i) => `<span class="sld-dot ${i === 0 ? 'active' : ''}"></span>`).join('')}</div>
          ` : ''}
        </div>
        <div class="b">
          <h4>${name}</h4>
          <span class="pr">$${price.toFixed(2)} USD</span>
          <div class="lk">
            <button class="checkout-btn" style="width:100%; padding:8px; font-size:14px;" onclick="addToCart('${name}', ${price}, '${link}')">Add to Cart</button>
          </div>
        </div>
      </article>
    `;
  }).join('');
}

// Funciones del Carrito
function toggleCart() {
  document.getElementById('cartDrawer').classList.toggle('open');
}

function addToCart(name, price, link) {
  cart.push({ name, price, link });
  updateCart();
  toggleCart(); // Abre el carrito automáticamente al agregar un producto
}

function removeFromCart(index) {
  cart.splice(index, 1);
  updateCart();
}

function updateCart() {
  localStorage.setItem('lomalort_cart', JSON.stringify(cart));
  document.getElementById('cart-count').innerText = cart.length;
  
  const container = document.getElementById('cart-items-container');
  if (cart.length === 0) {
    container.innerHTML = `<div class="empty-cart">Your cart is empty.</div>`;
    document.getElementById('cart-total-price').innerText = '$0.00 USD';
    return;
  }
  
  let total = 0;
  container.innerHTML = cart.map((item, index) => {
    total += item.price;
    return `
      <div class="cart-item">
        <div class="cart-item-info">
          <h5>${item.name}</h5>
          <span>$${item.price.toFixed(2)} USD</span>
        </div>
        <button class="cart-item-remove" onclick="removeFromCart(${index})">🗑️</button>
      </div>
    `;
  }).join('');
  
  document.getElementById('cart-total-price').innerText = `$${total.toFixed(2)} USD`;
}

function checkoutCart() {
  if (cart.length === 0) {
    alert('Your cart is empty!');
    return;
  }
  // Abre el link de pago del primer producto en el carrito (o puedes gestionar múltiples pestañas)
  window.open(cart[0].link, '_blank');
}

tb.onclick = e => {
  if (e.target.dataset.c) {
    cur = e.target.dataset.c;
    r();
  }
};

r();
updateCart();
</script>
<script src="layout.js"></script>
</body>
</html>
